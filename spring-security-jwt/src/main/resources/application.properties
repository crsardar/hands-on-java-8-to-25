spring.application.name=spring-security-jwt

server.port=8001
server.servlet.context-path=/spring-security-jwt


# Base64-encoded HMAC key, must be >= 256 bits for HS256.
# Dev default only - in real deployments inject JWT_SECRET (e.g. from Azure Key Vault).
# Generate one:  openssl rand -base64 32
app.jwt.secret=${JWT_SECRET:q3Hn0m1bJ8yQ2xZ5vR7tW9pL4kD6sF0aG2hJ5mN8bV4=}
app.jwt.issuer=com.crsardar.java
app.jwt.ttl=15m

# Set to DEBUG to watch the filter chain handle each request
logging.level.org.springframework.security=INFO
